<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start -->
    <!-- Standaardwaarden voor de dev-server. Bij de build vervangt
         scripts/prerender.mjs dit blok per pagina (titel, beschrijving,
         canonical, Open Graph en gestructureerde data uit src/data/seo.ts). -->
    <title>Mason Rental | Luxe auto huren in Capelle aan den IJssel</title>
    <meta name="description" content="Luxe auto huren in Capelle aan den IJssel bij Mason Rental." />
    <!-- seo:end -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#181818" />
    <!-- Cookiemelding al gezien? Verberg hem vóór de eerste weergave (zie CookieConsent.tsx). -->
    <script>
      try {
        if (localStorage.getItem("mr-cookie-consent"))
          document.documentElement.classList.add("cookie-ok");
      } catch (e) {}
    </script>
    <!-- Nippo variable font (gewicht 200–700), zelf gehost; @font-face staat in index.css -->
    <link
      rel="preload"
      href="/fonts/nippo-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
